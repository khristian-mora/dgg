name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          client/package-lock.json
          server/package-lock.json

    - name: Install Server Dependencies
      run: |
        cd server
        npm install

    - name: Setup Prisma and Run Server Tests
      run: |
        cd server
        npx prisma generate
        npx prisma db push
        npm test
      env:
        DATABASE_URL: "file:./dev.db"
        JWT_SECRET: "test_secret"
        # Add other required env vars if needed for the automation tests

    - name: Install Client Dependencies
      run: |
        cd client
        npm install

    - name: Build Client
      run: |
        cd client
        npm test
